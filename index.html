<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="register" class="register">Register</h1>
    <p>Please fill in this form to create an account</p>
    <hr />
    <form action="">
      <label for="email"><b>Email</b></label>
      <input type="email" id="email" class="email" placeholder="Enter Email" />

      <label for="password"><b>Password</b></label>
      <input
        type="password"
        id="password"
        class="password"
        placeholder="Enter Password"
      />

      <label for="repeat-password"><b>Repeat Password</b></label>
      <input
        type="password"
        id="repeat-password"
        class="repeat-password"
        placeholder="Enter Repeat Password"
      />
    </form>
    <hr />
    <p>
      By creating an account you agree to our
      <a href="">Terms & Privacy</a>
    </p>
    <button type="">Register</button>
    <p>Already have an account? <a href="">Sign in</a>.</p>
  </body>
</html>
