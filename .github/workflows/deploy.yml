name: CI/CD to Vagrant VM

on:
  push:
    branches:
      - SET-317-API

jobs:
  deploy:
    runs-on: self-hosted # Runner chạy trên máy của bạn

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to Vagrant VM (via localhost:2222)
        env:
          VM_IP: 192.168.77.10
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no vagrant@$VM_IP << 'EOF'
            echo "📂 Di chuyển vào thư mục project"
            cd ~/SET2025

            echo "🔄 Pull code mới"
            git pull origin SET-317-API

            echo "📦 Cài dependencies"

            echo "🛑 Dừng tiến trình cũ nếu có"
            pkill -f "node server.js" || true

            echo "🚀 Khởi chạy lại server"
            nohup node server.js > node.log 2>&1 &
            echo "✅ Deploy thành công vào Vagrant VM"
          EOF
