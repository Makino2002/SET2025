name: CI/CD Build, Push and Deploy Docker Image

on:
  push:
    branches:
      - SET-317-API

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: minhman2002/set2025-api:latest

  deploy:
    runs-on: self-hosted
    needs: build_and_push  # Chờ job build xong mới deploy

    steps:
      - name: Pull latest image từ DockerHub
        run: docker pull minhman2002/set2025-api:latest

      - name: Stop và remove container cũ nếu có
        run: |
          docker stop set2025 || true
          docker rm set2025 || true

      - name: Run container mới
        run: docker run -d -p 3000:3000 --name set2025 minhman2002/set2025-api:latest
