name: Deploy to Self-Hosted VPS

on:
  push:
    branches:
      - SET-317-API

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: SET-317-API

      - name: Restart Node.js server
        run: |
          echo "🔁 Restart server Node.js"
          cd ~/SET2025
          OLD_PID=$(pgrep -f "node server.js")
          if [ ! -z "$OLD_PID" ]; then
            echo "🛑 Dừng tiến trình cũ: PID=$OLD_PID"
            sudo kill -9 $OLD_PID
          fi
          echo "🚀 Chạy lại server"
          nohup node server.js > node.log 2>&1 &
