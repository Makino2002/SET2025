name: CI/CD Deploy to VPS using DockerHub

on:
  push:
    branches:
      - SET-317-API

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Cài Nginx nếu chưa có
        run: |
          which nginx || sudo apt update && sudo apt install -y nginx

      - name: Pull latest image from DockerHub
        run: docker pull minhman2002/set2025-api:latest

      - name: Stop and remove old container if exists
        run: |
          docker stop set2025 || true
          docker rm set2025 || true

      - name: Run new container
        run: docker run -d -p 3000:3000 --name set2025 minhman2002/set2025-api:latest

      - name: Reload Nginx
        run: sudo systemctl reload nginx || true
